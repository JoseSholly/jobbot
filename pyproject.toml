[project]
name = "jobbot"
version = "0.1.0"
description = "Multi-user Telegram job digest: CV-matched jobs (Nigeria + worldwide), twice a day, for $0."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "selectolax>=0.3.21",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "pypdf>=5.0",
    "numpy>=1.26",
    "fastembed>=0.4",
    "python-dotenv>=1.0",
]

[project.scripts]
jobbot-digest = "jobbot.entrypoints.digest:main"
jobbot-build-profile = "jobbot.entrypoints.build_profile:main"
jobbot-migrate = "jobbot.entrypoints.migrate:main"
jobbot-admin = "jobbot.entrypoints.admin:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
