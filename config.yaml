# JobBot configuration. Secrets live in environment variables / GitHub secrets, never here.
# See docs/configuration.md for every option.

digest:
  timezone: Africa/Lagos        # WAT; used to label morning/evening runs
  default_ng_quota: 4           # Nigerian jobs per message (users can change with /split)
  default_global_quota: 6       # international/remote jobs per message
  min_score: 50                 # drop anything below this (0-100)
  max_age_days: 14              # ignore jobs posted earlier than this
  send_delay_seconds: 0.5       # pause between users (Telegram rate limits)

scoring:
  weights:                      # must sum to 1.0
    semantic: 0.60
    skills: 0.25
    title: 0.10
    recency: 0.05
  semantic_floor: 0.15          # cosine at/below this maps to 0
  semantic_ceiling: 0.65        # cosine at/above this maps to 1
  skill_saturation: 5           # matching this many of the user's skills = full skill score
  feedback_max_adjust: 10       # +/- points from Save/Dismiss history
  feedback_min_events: 1        # need at least this many feedback events to re-rank

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2

retention:
  sent_days: 60                 # forget sent jobs after this many days
  jobs_days: 90                 # drop cached job rows (unless saved) after this

llm:
  model: gemini-2.5-flash
  match_reasons: true           # one-line "why it matches" per job (needs GEMINI_API_KEY)
  max_reason_users_per_run: 50  # stay inside the Gemini free-tier rate limit

search:
  max_keywords: 12              # cap on distinct job titles sent to query-style sources
  max_skills: 4                 # top skills (e.g. Python, Django) used for skill searches

http:
  timeout_seconds: 30
  user_agent: "JobBot/0.1 (+https://github.com/JoseSholly/jobbot)"
  scraper_delay_seconds: 2.0    # politeness delay between scraper requests

sources:
  remotive:                     # Remotive asks for few calls a day, so keep max_categories small
    enabled: true
    max_categories: 3             # users' own fields first (design, writing, ...), then these
    categories: [software-dev, data]   # data = data science / AI / ML
  remoteok:       {enabled: true}
  himalayas:      {enabled: true, max_pages: 10}
  arbeitnow:      {enabled: true, max_pages: 3}
  jobicy:         {enabled: true, count: 100, max_tags: 3}   # + one search per top skill
  weworkremotely:
    enabled: true
    feeds:
      - https://weworkremotely.com/categories/remote-back-end-programming-jobs.rss
      - https://weworkremotely.com/categories/remote-front-end-programming-jobs.rss
      - https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss
      - https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss
      - https://weworkremotely.com/categories/remote-design-jobs.rss
      - https://weworkremotely.com/categories/remote-product-jobs.rss
      - https://weworkremotely.com/categories/remote-customer-support-jobs.rss
      - https://weworkremotely.com/categories/remote-sales-and-marketing-jobs.rss
  jooble:                       # needs JOOBLE_API_KEY *for this host* (keys are per country)
    enabled: true
    host: ng.jooble.org         # Nigeria; get the key at https://ng.jooble.org/api/about
    pages_per_keyword: 1
  pythonjobs:     {enabled: true}   # python.org job board (Python-only roles)
  workingnomads:  {enabled: true}   # remote jobs feed, strong in development
  hnhiring:       {enabled: true}   # Hacker News monthly "Who is hiring?" (remote posts only)
  # Nigerian job boards through the RSS feeds they publish (all jobs tagged Nigeria).
  # A feed can be a direct RSS/Atom URL, or a page listing feeds plus the link text to follow.
  ngfeeds:
    enabled: true
    feeds:
      - name: myjobmag
        url: https://www.myjobmag.com/feeds/
        link_text: Detailed RSS
      - name: hotnigerianjobs
        url: https://www.hotnigerianjobs.com/feed/rss.xml
  # Scrapers: check robots.txt / terms before enabling. Isolated: if one breaks, the run continues.
  myjobmag:       {enabled: false, pages_per_keyword: 1}
  jobberman:      {enabled: false, pages_per_keyword: 1}
  ats:
    enabled: true
    # Public job-board JSON of hand-picked companies. The value is the board token from the
    # company's careers URL, e.g. boards.greenhouse.io/<token>, jobs.lever.co/<token>,
    # jobs.ashbyhq.com/<token>. Unknown tokens are logged and skipped.
    greenhouse: [gitlab, canonical]   # both hire remote worldwide, lots of Python
    lever: []
    ashby: []
